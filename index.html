  if (!(window.crypto && crypto.subtle)) throw new Error('Browser tidak mendukung enkripsi. Buka aplikasi lewat HTTPS.');

const head = (t, s = '') => `<div class="ph-h"><h2>${esc(t)}</h2>${s ? `<p>${esc(s)}</p>` : ''}</div>`;
const errMsg = e => (e && (e.code === 'permission-denied' || /permission/i.test(e.message || ''))) ? 'Akses ditolak oleh Firestore. Periksa Security Rules.' : (e?.message || 'Terjadi kesalahan.');

function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function compressFile(file, max, q, png) {
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImg(url);
    const sc = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    let out = png ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', q);
    if (png && out.length > 180000) out = c.toDataURL('image/jpeg', q);
    return out;
  } finally { URL.revokeObjectURL(url); }
}
function download(name, text, type = 'text/csv;charset=utf-8') {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\uFEFF' + text], { type })); a.download = name; document.body.appendChild(a); a.click(); a.remove();
}

async function createFsDB() {
  const [{ initializeApp }, A, F] = await Promise.all([import(FB + 'firebase-app.js'), import(FB + 'firebase-auth.js'), import(FB + 'firebase-firestore.js')]);
  const app = initializeApp(firebaseConfig), auth = A.getAuth(app), db = F.getFirestore(app);
  const dd = s => s.exists() ? s.data() : null;
  const lst = async q => (await F.getDocs(q)).docs.map(x => ({ ...x.data(), id: x.id }));
  return {
    auth: {
      login: async (e, p) => (await A.signInWithEmailAndPassword(auth, e.trim(), p)).user.email,
      logout: () => A.signOut(auth),
      onChange: cb => A.onAuthStateChanged(auth, u => cb(u ? u.email : null))
    },
    getSekolah: async () => dd(await F.getDoc(F.doc(db, 'settings', 'sekolah'))),
    saveSekolah: d => F.setDoc(F.doc(db, 'settings', 'sekolah'), d),
    getCfg: async () => dd(await F.getDoc(F.doc(db, 'settings', 'absensi'))),
    saveCfg: d => F.setDoc(F.doc(db, 'settings', 'absensi'), d),
    getUser: async u => dd(await F.getDoc(F.doc(db, 'users', u))),
    listUsers: async () => (await F.getDocs(F.collection(db, 'users'))).docs.map(x => x.data()),
    saveUser: (u, d) => F.setDoc(F.doc(db, 'users', u), d, { merge: true }),
    deleteUser: u => F.deleteDoc(F.doc(db, 'users', u)),
    changePass: (u, nh, oh) => F.updateDoc(F.doc(db, 'users', u), { passHash: nh, proof: oh }),
    getAbsensi: async id => dd(await F.getDoc(F.doc(db, 'absensi', id))),
    createAbsensi: (id, d) => F.setDoc(F.doc(db, 'absensi', id), { ...d, waktuServer: F.serverTimestamp() }),
    updateAbsensi: (id, d) => F.updateDoc(F.doc(db, 'absensi', id), { ...d, pulangServer: F.serverTimestamp() }),
    listAbsensi: (from, to) => lst(F.query(F.collection(db, 'absensi'), F.where('tanggal', '>=', from), F.where('tanggal', '<=', to))),
    listIzinUser: u => lst(F.collection(db, 'users', u, 'izin')),
    addIzin: (u, id, d) => F.setDoc(F.doc(db, 'users', u, 'izin', id), { ...d, ts: F.serverTimestamp() }),
    cancelIzin: (u, id) => F.deleteDoc(F.doc(db, 'users', u, 'izin', id)),
    listIzinAll: () => lst(F.collectionGroup(db, 'izin')),
    setIzinStatus: (u, id, status, catatan) => F.updateDoc(F.doc(db, 'users', u, 'izin', id), { status, catatan })
  };
}

let stream = null;
async function startCam() {
  stopCam();
  if (!navigator.mediaDevices?.getUserMedia) throw new Error('Kamera tidak didukung. Gunakan HTTPS dan browser terbaru.');
  stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 720 }, height: { ideal: 960 } }, audio: false });
  const v = $('#cam'); v.srcObject = stream; await v.play();
}
function stopCam() { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } }
function snapPhoto() {
  const v = $('#cam'); if (!v.videoWidth) throw new Error('Kamera belum siap.');
  const w = 480, h = Math.round(w * v.videoHeight / v.videoWidth);
  const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
  x.translate(w, 0); x.scale(-1, 1); x.drawImage(v, 0, 0, w, h); x.setTransform(1, 0, 0, 1, 0, 0);
  const d = new Date(); x.fillStyle = 'rgba(0,0,0,.5)'; x.fillRect(0, h - 28, w, 28); x.fillStyle = '#fff'; x.font = '13px sans-serif';
  x.fillText(`${S.user.nama} · ${ymd(d)} ${hm(d)}`, 8, h - 10);
  return c.toDataURL('image/jpeg', 0.6);
}
function getPos() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error('Perangkat tidak mendukung GPS.'));
    navigator.geolocation.getCurrentPosition(p => res(p.coords), e => rej(new Error(e.code === 1 ? 'Izin lokasi ditolak. Aktifkan izin lokasi di pengaturan browser.' : e.code === 2 ? 'Lokasi tidak tersedia. Aktifkan GPS Anda.' : 'Pencarian lokasi melebihi batas waktu. Coba lagi.')), { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  });
}

const izinOn = (list, ds) => (list || []).find(i => i.status === 'Disetujui' && i.tglMulai <= ds && ds <= i.tglSelesai);
function windowState(mode, cfg, now = new Date()) {
  const m = now.getHours() * 60 + now.getMinutes();
  if (mode === 'masuk') {
    if (m < toMin(cfg.jamMasukMulai)) return { open: false, msg: `Absen masuk dibuka pukul ${cfg.jamMasukMulai}.` };
    if (m > toMin(cfg.jamPulangAkhir)) return { open: false, msg: `Absen ditutup pukul ${cfg.jamPulangAkhir}.` };
    return { open: true, msg: `Batas tepat waktu pukul ${cfg.jamMasukBatas}${cfg.toleransiMenit ? ` (+${cfg.toleransiMenit} menit toleransi)` : ''}.` };
  }
  if (m > toMin(cfg.jamPulangAkhir)) return { open: false, msg: `Absen pulang ditutup pukul ${cfg.jamPulangAkhir}.` };
  return { open: true, msg: m < toMin(cfg.jamPulangMulai) ? `Jam pulang resmi pukul ${cfg.jamPulangMulai}. Pulang sebelumnya tercatat "Pulang Cepat".` : 'Silakan absen pulang.' };
}
function absenLines(r) {
  if (!r) return '<p class="mut sm">Belum ada data.</p>';
  return `${r.foto ? `<img src="${esc(r.foto)}" alt="Selfie" style="width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px">` : ''}
  <div class="kv"><span>Waktu</span><span><b>${esc(r.waktu)}</b> ${chip(r.status)}</span><span>Jarak</span><span>${fmtJarak(r.jarak)} dari lokasi (akurasi ±${r.akurasi || 0} m)</span><span>Koordinat</span><span><a href="${mapsUrl(r.lat, r.lng)}" target="_blank" rel="noopener">${r.lat}, ${r.lng}</a></span>${r.terlambatMenit ? `<span>Terlambat</span><span>${r.terlambatMenit} menit</span>` : ''}</div>`;
}
function showAbsen(a) {
  const sv = srvDate(a.waktuServer), dv = a.masuk?.iso ? new Date(a.masuk.iso) : null;
  const warn = sv && dv && Math.abs(sv - dv) > 10 * 60000;
  modal(`${a.nama} · ${fmtPendek(a.tanggal)}`, `${warn ? notice('Jam perangkat berbeda lebih dari 10 menit dari jam server. Periksa keabsahan data.') : ''}
  <div class="photos"><div><b>Masuk</b>${absenLines(a.masuk)}</div><div><b>Pulang</b>${absenLines(a.pulang)}</div></div>`, true);
}

function camUI(st) {
  const b = $('#camBtns'); if (!b) return;
  $('#cam').hidden = st !== 'live'; $('#shot').hidden = st !== 'done'; $('#camPh').hidden = st !== 'idle';
  b.innerHTML = st === 'live' ? `<button class="btn pri block" data-act="camSnap">${ic('camera')} Ambil Foto</button>`
    : st === 'done' ? `<button class="btn block" data-act="camOpen">${ic('refresh')} Ulangi Foto</button>`
      : `<button class="btn pri block" data-act="camOpen">${ic('camera')} Buka Kamera</button>`;
}
function updateSend() {
  const b = $('#btnSend'); if (!b || !S.cfg) return;
  const ok = A.pos && A.jarak <= S.cfg.radius && A.foto && windowState(A.mode, S.cfg).open && !A.sending;
  b.disabled = !ok;
}
actions.camOpen = async () => {
  A.foto = null; updateSend();
  try { await startCam(); camUI('live'); }
  catch (e) { camUI('idle'); toast(e.name === 'NotAllowedError' ? 'Izin kamera ditolak. Aktifkan izin kamera di browser.' : errMsg(e), 'err'); }
};
actions.camSnap = () => {
  A.foto = snapPhoto(); $('#shot').src = A.foto; stopCam(); camUI('done'); updateSend();
};
actions.getLoc = async () => {
  const box = $('#locBox'); if (!box) return;
  box.innerHTML = `<div class="loc"><div class="spin" style="width:24px;height:24px;border-width:3px"></div><div>Mencari lokasi…</div></div>`;
  A.pos = null; A.jarak = null; updateSend();
  try {
    const p = await getPos(), cfg = S.cfg;
    A.pos = p; A.jarak = jarakM(p.latitude, p.longitude, cfg.lat, cfg.lng);
    const ok = A.jarak <= cfg.radius;
    box.innerHTML = `<div class="loc ${ok ? 'ok' : 'bad'}">${ic('pin')}<div><b>${ok ? 'Anda berada di area absensi' : 'Anda di luar area absensi'}</b><div class="sm">Jarak ${fmtJarak(A.jarak)} dari ${esc(cfg.namaLokasi)} (maks. ${cfg.radius} m) · akurasi ±${Math.round(p.accuracy)} m</div></div></div>
    ${!ok && IS_PREVIEW ? `<button class="btn s" style="margin-bottom:10px" data-act="demoSetLoc">Demo: jadikan posisi saya sebagai lokasi sekolah</button>` : ''}`;
  } catch (e) { box.innerHTML = `<div class="loc bad">${ic('alert')}<div>${esc(e.message)}</div></div>`; }
  updateSend();
};
actions.demoSetLoc = async () => {
  if (!IS_PREVIEW || !A.pos) return;
  S.cfg = { ...cfgOrDefault(), lat: A.pos.latitude, lng: A.pos.longitude }; await DB.saveCfg(S.cfg); await actions.getLoc();
};
actions.sendAbsen = async () => {
  if (A.sending) return;
  const cfg = S.cfg, u = S.user, now = new Date(), today = ymd(now), mins = now.getHours() * 60 + now.getMinutes();
  const w = windowState(A.mode, cfg, now); if (!w.open) return toast(w.msg, 'err');
  if (!A.pos || A.jarak > cfg.radius) return toast('Anda berada di luar area absensi.', 'err');
  if (!A.foto) return toast('Ambil foto selfie terlebih dahulu.', 'err');
  A.sending = true; updateSend(); busy(true);
  try {
    const id = `${today}_${u.username}`, cur = await DB.getAbsensi(id);
    if (A.mode === 'masuk' && cur) throw new Error('Anda sudah absen masuk hari ini.');
    if (A.mode === 'pulang' && (!cur || cur.pulang)) throw new Error('Data absen pulang tidak valid atau sudah tercatat.');
    const rec = { waktu: hm(now), iso: now.toISOString(), lat: +A.pos.latitude.toFixed(6), lng: +A.pos.longitude.toFixed(6), jarak: Math.round(A.jarak), akurasi: Math.round(A.pos.accuracy || 0), status: '', foto: A.foto };
    if (A.mode === 'masuk') {
      const late = mins > toMin(cfg.jamMasukBatas) + Number(cfg.toleransiMenit || 0);
      rec.status = late ? 'Terlambat' : 'Tepat Waktu'; rec.terlambatMenit = late ? mins - toMin(cfg.jamMasukBatas) : 0;
      await DB.createAbsensi(id, { username: u.username, nama: u.nama, tanggal: today, masuk: rec });
    } else {
      rec.status = mins < toMin(cfg.jamPulangMulai) ? 'Pulang Cepat' : 'Tepat Waktu';
      await DB.updateAbsensi(id, { pulang: rec });
    }
    stopCam();
    modal('Absen Berhasil', `<div class="center"><div style="font-size:44px;color:var(--ok)">✓</div><h3>Absen ${A.mode === 'masuk' ? 'masuk' : 'pulang'} tercatat</h3><p class="mut" style="margin:6px 0 10px">Pukul ${esc(rec.waktu)} · ${chip(rec.status)}</p><button class="btn pri block" data-act="doneAbsen">Selesai</button></div>`);
  } catch (e) { toast(errMsg(e), 'err'); }
  finally { A.sending = false; busy(false); updateSend(); }
};

PAGES.guru.riwayat = async () => {
  const v = $('#view'); v.innerHTML = loading();
  S.cfg = await DB.getCfg(); const cfg = cfgOrDefault(), u = S.user;
  const m = S.riwMonth || ymd(new Date()).slice(0, 7), today = ymd(new Date());
  const [y, mo] = m.split('-').map(Number), last = new Date(y, mo, 0).getDate(), days = [];
  for (let d = 1; d <= last; d++) { const ds = `${m}-${pad(d)}`; if (ds > today) break; days.push(ds); }
  const [docs, izin] = await Promise.all([Promise.all(days.map(ds => DB.getAbsensi(`${ds}_${u.username}`))), DB.listIzinUser(u.username)]);
  const start = u.createdAt || '0000-00-00', rows = [], sum = { tepat: 0, telat: 0, izin: 0, alpa: 0 };
  days.forEach((ds, i) => {
    const rec = docs[i], iz = izinOn(izin, ds), kerja = cfg.hariKerja.includes(new Date(ds + 'T00:00:00').getDay());
    let st = null;
    if (rec) { st = rec.masuk.status; st === 'Terlambat' ? sum.telat++ : sum.tepat++; }
    else if (iz) { st = iz.jenis; sum.izin++; }
    else if (kerja && ds < today && ds >= start) { st = 'Tidak Absen'; sum.alpa++; }
    else if (kerja && ds === today) st = 'Belum Absen';
    if (st) rows.push({ ds, rec, st });
  });
  rows.reverse(); S.riwRows = rows;
  v.innerHTML = `${head('Riwayat Absensi')}
  <input class="inp" type="month" value="${m}" max="${today.slice(0, 7)}" data-change="riwMonth" style="margin-bottom:14px">
  <div class="stats"><div class="card stat"><b>${sum.tepat}</b><span>Tepat waktu</span></div><div class="card stat"><b>${sum.telat}</b><span>Terlambat</span></div><div class="card stat"><b>${sum.izin}</b><span>Izin/Sakit/Cuti</span></div><div class="card stat"><b>${sum.alpa}</b><span>Tidak absen</span></div></div>
  <div class="card">${rows.length ? rows.map(r => `<div class="row ${r.rec ? 'tap' : ''}" ${r.rec ? `data-act="riwDetail" data-ds="${r.ds}"` : ''}><div class="g"><b>${esc(fmtTanggal(r.ds))}</b><span>${r.rec ? `Masuk ${esc(r.rec.masuk.waktu)}${r.rec.pulang ? ' · Pulang ' + esc(r.rec.pulang.waktu) : ' · Belum pulang'}` : '—'}</span></div><div class="r">${chip(r.st)}</div></div>`).join('') : emptyBox('Belum ada data pada bulan ini.', 'clock')}</div>`;
};

changes.csvImport = async t => {
  const file = t.files[0]; if (!file) return;
  const txt = await file.text(); t.value = '';
  const lines = txt.replace(/^\uFEFF/, '').split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) return toast('File CSV kosong.', 'err');
  const sep = lines[0].includes(';') && !lines[0].includes(',') ? ';' : ',';
  const rows = lines.map(l => l.split(sep).map(c => c.trim().replace(/^"|"$/g, '')));
  if (/^username$/i.test(rows[0][0])) rows.shift();
  busy(true); let ok = 0, skip = 0;
  try {
    for (const [un, nama, nip, pass] of rows) {
      const u = (un || '').toLowerCase();
      if (!/^[a-z0-9._-]{3,30}$/.test(u) || !nama || !pass || pass.length < 6 || await DB.getUser(u)) { skip++; continue; }
      await DB.saveUser(u, { username: u, nama, nip: nip || '', passHash: await hashPass(u, pass), aktif: true, role: 'guru', createdAt: ymd(new Date()) }); ok++;
    }
  } finally { busy(false); }
  toast(`Impor selesai: ${ok} ditambahkan, ${skip} dilewati.`, ok ? 'ok' : 'err'); go('guru');
};

function loadLeaflet() {

}
let mapObj = null;
async function setLokasi() {
  const c = cfgOrDefault();
  $('#setBody').innerHTML = `<div class="card pad"><form data-form="saveLokasi" id="fLok">
    <label class="f" style="margin-top:0">Nama lokasi</label><input class="inp" name="namaLokasi" value="${esc(c.namaLokasi)}" required>
    <div id="map" class="map"><div class="empty">Memuat peta…</div></div>
    <p class="mut sm">Klik peta atau geser penanda untuk mengubah posisi sekolah. Lingkaran biru menunjukkan radius absensi.</p>
    <div class="grid2"><div><label class="f">Latitude</label><input class="inp" name="lat" inputmode="decimal" value="${c.lat}" required></div><div><label class="f">Longitude</label><input class="inp" name="lng" inputmode="decimal" value="${c.lng}" required></div></div>
    <label class="f">Radius absensi (meter)</label><input class="inp" type="number" name="radius" min="10" max="5000" value="${c.radius}" required>
    <label class="f">Tempel koordinat dari Google Maps (contoh: -6.2, 106.8)</label><input class="inp" id="pasteLL" placeholder="-6.200000, 106.816666">
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button type="button" class="btn" data-act="useMyLoc">${ic('gps')} Gunakan lokasi saya sekarang</button><a class="btn" id="gmLink" target="_blank" rel="noopener" href="${mapsUrl(c.lat, c.lng)}">${ic('pin')} Buka di Google Maps</a></div>
    <button class="btn pri block lg" style="margin-top:18px">${ic('check')} Simpan Lokasi</button></form></div>`;
  const f = $('#fLok'); let marker, circle;
  const setPos = (lat, lng, pan = true) => {
    f.lat.value = (+lat).toFixed(6); f.lng.value = (+lng).toFixed(6); $('#gmLink').href = mapsUrl(f.lat.value, f.lng.value);
    if (marker) { marker.setLatLng([lat, lng]); circle.setLatLng([lat, lng]); if (pan) mapObj.setView([lat, lng], mapObj.getZoom()); }
  };
  window.__setLokasi = setPos;
  const fromInputs = () => { const la = parseFloat(f.lat.value), lo = parseFloat(f.lng.value); if (isFinite(la) && isFinite(lo)) setPos(la, lo); };
  f.lat.addEventListener('change', fromInputs); f.lng.addEventListener('change', fromInputs);
  f.radius.addEventListener('input', () => { if (circle) circle.setRadius(Number(f.radius.value) || 0); });
  $('#pasteLL').addEventListener('change', e => { const m = e.target.value.match(/(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)/); if (m) { setPos(+m[1], +m[2]); e.target.value = ''; } else toast('Format koordinat tidak dikenali.', 'err'); });
  try {
    await loadLeaflet();
    if (!$('#map')) return;
    $('#map').innerHTML = ''; mapObj = L.map('map').setView([c.lat, c.lng], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(mapObj);
    marker = L.marker([c.lat, c.lng], { draggable: true }).addTo(mapObj);
    circle = L.circle([c.lat, c.lng], { radius: c.radius, color: '#2563eb', fillOpacity: .12 }).addTo(mapObj);
    marker.on('dragend', () => { const p = marker.getLatLng(); setPos(p.lat, p.lng, false); circle.setLatLng(p); });
    mapObj.on('click', e => setPos(e.latlng.lat, e.latlng.lng));
    onLeave(() => { if (mapObj) { mapObj.remove(); mapObj = null; } });
  } catch (e) { const m = $('#map'); if (m) m.innerHTML = '<div class="empty">Peta tidak dapat dimuat. Isi koordinat secara manual.</div>'; }
}

changes.logoPick = async t => {
  const file = t.files[0]; if (!file) return;
  busy(true);
  try { tmpLogo = await compressFile(file, 256, 0.85, /png|svg|webp/i.test(file.type)); $('#logoPrev').innerHTML = `<img class="logo" style="width:72px;height:72px" src="${tmpLogo}" alt="Logo">`; }
  catch (e) { toast('Gambar tidak dapat dibaca.', 'err'); } finally { busy(false); }
};
actions.logoDel = () => { tmpLogo = ''; $('#logoPrev').innerHTML = `<span class="logo ph" style="width:72px;height:72px">${ic('building')}</span>`; };
forms.saveSekolah = async f => {
  const d = { nama: f.nama.value.trim(), logo: tmpLogo === undefined ? (S.sekolah.logo || '') : tmpLogo };
  busy(true);
  try { await DB.saveSekolah(d); S.sekolah = d; } finally { busy(false); }
  applyTitle(); renderShell(); go('setting'); toast('Identitas sekolah disimpan.');
};

/* =========================================================
   PWA (manifest Data URI + Service Worker dari Blob)
========================================================= */
function injectPWA() {
  try {
    if (!document.querySelector('link[rel="manifest"]')) {
      const icon = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="110" fill="#2563eb"/><path d="M256 120a96 96 0 0 0-96 96c0 72 96 176 96 176s96-104 96-176a96 96 0 0 0-96-96zm0 130a34 34 0 1 1 0-68 34 34 0 0 1 0 68z" fill="#fff"/></svg>');
      const man = { name: 'Absensi Guru', short_name: 'Absensi', start_url: location.href.split('#')[0], display: 'standalone', background_color: '#ffffff', theme_color: '#2563eb', icons: [{ src: icon, sizes: 'any', type: 'image/svg+xml', purpose: 'any' }] };
      const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(man)); document.head.appendChild(l);
    }
    if ('serviceWorker' in navigator) {
      const code = "self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));self.addEventListener('fetch',()=>{});";
      navigator.serviceWorker.register(URL.createObjectURL(new Blob([code], { type: 'text/javascript' }))).catch(() => { });
    }
  } catch (e) { }
}

/* =========================================================
   BOOT
========================================================= */
(async function boot() {
  injectPWA();
  root.innerHTML = loading();
  try { DB = IS_PREVIEW ? await createMemDB() : await createFsDB(); }
  catch (e) { root.innerHTML = `<div class="login-wrap"><div class="card pad login-card">${notice('Gagal memuat Firebase: ' + esc(e.message) + '<br>Periksa firebaseConfig dan koneksi internet.')}</div></div>`; return; }
  try { S.sekolah = { nama: '', logo: '', ...((await DB.getSekolah()) || {}) }; } catch (e) { S.sekolah = { nama: '', logo: '' }; }
  applyTitle();
  DB.auth.onChange(async email => {
    if (email) { S.role = 'admin'; S.user = { email, nama: 'Administrator' }; await enterApp(); }
    else if (S.role !== 'guru') { S.role = null; S.user = null; renderLogin(); }
  });
})();
</script>
